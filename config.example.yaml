# Copy to config.yaml (git-ignored) and edit. NEVER put secrets here —
# credentials live in a local file or the OS keyring (see credential_store
# below), set via `financial-mcp-login`.

# Bare filenames (no leading /) auto-resolve under ~/.financial_mcp/ — e.g.
# "cache.db" becomes ~/.financial_mcp/cache.db. That directory is created for
# you. Give an absolute path instead if you want it stored somewhere else.
db_path: cache.db
log_level: INFO
log_file: financial_mcp.log      # same auto-resolve rule; omit or null for stderr only

# off = reads only | safe = reads + reversible writes | full = + destructive
# Ships read-only. Change to "safe" (or "full") to enable writes.
# IMPORTANT: Quote "off" (bare off is parsed as boolean false by YAML)
write_mode: "off"
batch_cap: 200

# Cache freshness in SECONDS, per data type.
cache_ttls:
  transactions: 43200   # 12h
  balances: 43200       # 12h
  investments: 43200    # 12h
  holdings: 43200       # 12h
  budgets: 86400        # 24h
  networth: 86400       # 24h
  cashflow: 86400       # 24h
  categories: 604800    # 7d
  merchants: 604800     # 7d

# Offline CSV fallback (Plan 1). Point at copies of your Monarch exports.
csv_transactions_path: null
csv_balances_path: null

# Data source: "csv" = offline Plan-1 exports | "live" = Monarch API.
# Run `financial-mcp-login` once before using "live" — it stores your Monarch
# session. If "live" is set but no session is stored, the server logs a
# warning and falls back to CSV.
source: csv
keyring_service_name: financial_mcp_monarch

# credentials: file store by default (~/.financial_mcp/session.json, chmod 600).
# Set credential_store: keyring for OS-keyring storage (may prompt once on macOS).
# credential_store: file
# credential_file: ~/.financial_mcp/session.json
