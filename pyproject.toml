[project]
name = "financial-mcp"
version = "1.0.0"
description = "Local MCP server that lets Claude read and safely maintain your Monarch Money data"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0,<2",  # mcp 2.x renamed FastMCP -> MCPServer; v1 code targets the 1.x API
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "aiohttp>=3.9",
    "playwright>=1.40",
    "certifi>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
]

[project.scripts]
financial-mcp = "financial_mcp.main:main"
financial-mcp-login = "financial_mcp.login_cli:main"
financial-mcp-doctor = "financial_mcp.doctor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["financial_mcp*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.black]
target-version = ["py312"]
line-length = 100
